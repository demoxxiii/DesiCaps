name: DesiCaps
options:
  bundleIdPrefix: in.klyn
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: whisper.xcconfig
  Release: whisper.xcconfig
targets:
  DesiCaps:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DesiCaps
        excludes:
          - "www/**"
          - "models/**"
          - "Info.plist"
          - "Bridging-Header.h"
      - path: DesiCaps/www
        type: folder
        buildPhase: resources
      - path: DesiCaps/models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.klyn.desicaps
        PRODUCT_NAME: DesiCaps
        INFOPLIST_FILE: DesiCaps/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: DesiCaps/Bridging-Header.h
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTED_PLATFORMS: iphoneos
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreImage.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
